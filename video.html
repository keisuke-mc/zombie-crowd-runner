<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MP4をHEVC(H.265)に変換するツール</title>
    
    <!-- GitHub Pages対応スクリプト -->
    <script src="https://unpkg.com/coi-serviceworker@0.1.7/dist/coi-serviceworker.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #status { 
            font-weight: bold; 
            color: #0056b3; 
            margin: 20px auto; 
            padding: 12px; 
            background: #eef5ff; 
            border-radius: 6px; 
            display: inline-block; 
            max-width: 90%; 
            word-break: break-all;
        }
    </style>
</head>
<body>
    <script src="https://iwb.jp/s/js/tiny-console.js"></script>
    <h1>MP4動画をHEVC(H.265)に変換</h1>
    <p>変換したいMP4ファイルを選んでください</p>
    
    <input type="file" id="uploader" accept="video/mp4" disabled>
    
    <div id="status">システムを初期化中...</div>

    <br>
    <video id="output-video" controls width="400" style="display:none; margin-top: 20px;"></video>
    <br>
    <a id="download-link" style="display:none; font-size: 18px; margin-top: 10px; display:inline-block;">変換された動画をダウンロード</a>

    <script type="module">
        import { FFmpeg } from 'https://esm.sh/@ffmpeg/ffmpeg@0.12.10';
        import { fetchFile } from 'https://esm.sh/@ffmpeg/util@0.12.1';

        const status = document.getElementById('status');
        const uploader = document.getElementById('uploader');
        const outputVideo = document.getElementById('output-video');
        const downloadLink = document.getElementById('download-link');

        let ffmpeg = null;

        async function initFFmpeg() {
            ffmpeg = new FFmpeg();
            
            ffmpeg.on('log', ({ message }) => {
                console.log("[FFmpeg Log]:", message);
                status.textContent = 'ロード中: ' + message;
            });

            status.textContent = 'FFmpegのコアファイルを読み込み中...';

            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
            
            try {
                // toBlobURLを使わず、直接URLを指定して読み込むことでブロックを回避しやすくします
                await ffmpeg.load({
                    coreURL: `${baseURL}/ffmpeg-core.js`,
                    wasmURL: `${baseURL}/ffmpeg-core.wasm`,
                });

                status.textContent = '準備完了！変換したいMP4ファイルを選択してください。';
                uploader.removeAttribute('disabled');
            } catch (err) {
                console.error("FFmpeg Load Error:", err);
                status.textContent = 'エラー発生: ' + err.message + ' （※ブラウザのセキュリティ制限の可能性があります）';
            }
        }

        initFFmpeg();

        uploader.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.textContent = '動画を読み込んでいます...';
            uploader.setAttribute('disabled', 'true');

            ffmpeg.on('progress', ({ progress }) => {
                const percent = Math.round(progress * 100);
                status.textContent = `変換中... 進行度: ${percent}%`;
            });

            await ffmpeg.writeFile('input.mp4', await fetchFile(file));
            await ffmpeg.exec(['-i', 'input.mp4', '-c:v', 'libx265', '-c:a', 'copy', 'output.mp4']);

            status.textContent = '変換が完了しました！';

            const data = await ffmpeg.readFile('output.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

            outputVideo.src = url;
            outputVideo.style.display = 'block';

            downloadLink.href = url;
            downloadLink.download = 'output_hevc.mp4';
            downloadLink.textContent = '💾 変換されたHEVC動画をダウンロード';
            downloadLink.style.display = 'inline-block';
        });
    </script>
</body>
</html>
